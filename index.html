<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peek</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; background: #111; color: #eee; }
  aside { padding: 16px; border-right: 1px solid #2a2a2a; }
  aside h1 { font-size: 20px; margin: 0 0 16px; }
  nav a { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  nav a.on, nav a:hover { background: #2a2a2a; }
  main { padding: 16px; }
  #grid { columns: 240px; column-gap: 12px; margin-top: 16px; }
  .card { break-inside: avoid; margin-bottom: 12px; background: #1c1c1c; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; display: block; }
  .meta { padding: 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip { background: #2f2f2f; border-radius: 99px; padding: 2px 4px 2px 10px; }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; background: #222; color: inherit; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; }
  button.x { border: 0; background: none; padding: 0 4px; cursor: pointer; color: #888; }
  button.x:hover { color: #f66; }
  #newcat input { width: 100%; box-sizing: border-box; margin-top: 12px; }
</style>
<aside>
  <h1>Peek</h1>
  <nav id="cats"></nav>
  <form id="newcat"><input name="name" placeholder="+ Nouvelle catégorie" required></form>
</aside>
<main>
  <form id="up">
    <input type="file" name="file" accept="image/*" multiple required>
    <select name="category" id="upcat"></select>
    <button>Uploader</button>
  </form>
  <div id="grid"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const api = (u, o) => fetch(u, o).then(r => r.ok ? r.json() : Promise.reject(r.status));
  function el(tag, props, ...kids) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...kids);
    return e;
  }
  let cats = [], current = null;

  async function load() {
    cats = await api('/api/categories');
    const pick = id => () => { current = id; load(); };
    $('cats').replaceChildren(
      el('a', { className: current === null ? 'on' : '', onclick: pick(null) }, 'Toutes'),
      ...cats.map(c => el('a', { className: current === c.id ? 'on' : '', onclick: pick(c.id) },
        c.name,
        el('span', {}, String(c.count), el('button', {
          className: 'x', title: 'Supprimer la catégorie',
          onclick: async e => {
            e.stopPropagation();
            if (!confirm(`Supprimer « ${c.name} » ? Les photos restent.`)) return;
            await api('/api/categories/' + c.id, { method: 'DELETE' });
            if (current === c.id) current = null;
            load();
          },
        }, '×')))));
    $('upcat').replaceChildren(el('option', { value: '' }, 'Sans catégorie'),
      ...cats.map(c => el('option', { value: c.id, selected: c.id === current }, c.name)));
    const photos = await api('/api/photos' + (current ? '?category=' + current : ''));
    $('grid').replaceChildren(...photos.map(card));
  }

  function card(p) {
    const name = id => cats.find(c => c.id === id)?.name ?? '?';
    const go = (u, method) => api(u, { method }).then(load);
    return el('div', { className: 'card' },
      el('a', { href: '/img/' + p.file, target: '_blank' }, el('img', { src: '/img/' + p.file, loading: 'lazy' })),
      el('div', { className: 'meta' },
        ...p.categories.map(id => el('span', { className: 'chip' }, name(id),
          el('button', { className: 'x', onclick: () => go(`/api/photos/${p.id}/categories/${id}`, 'DELETE') }, '×'))),
        el('select', { onchange: e => go(`/api/photos/${p.id}/categories/${e.target.value}`, 'PUT') },
          el('option', { value: '' }, '+ catégorie'),
          ...cats.filter(c => !p.categories.includes(c.id)).map(c => el('option', { value: c.id }, c.name))),
        /^https?:\/\//.test(p.source || '') ? el('a', { href: p.source, target: '_blank', rel: 'noreferrer', title: p.source }, '↗') : '',
        el('button', { className: 'x', title: 'Supprimer la photo', onclick: () => confirm('Supprimer la photo ?') && go('/api/photos/' + p.id, 'DELETE') }, '🗑')));
  }

  $('newcat').onsubmit = async e => {
    e.preventDefault();
    await api('/api/categories', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: new FormData(e.target).get('name') }) });
    e.target.reset();
    load();
  };
  $('up').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try { await api('/api/photos', { method: 'POST', body: new FormData(e.target) }); e.target.reset(); }
    catch (s) { alert('Upload échoué (' + s + ')'); }
    btn.disabled = false;
    load();
  };
  load();
</script>
