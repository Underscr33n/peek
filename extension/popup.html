<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 520px; margin: 0; font: 13px system-ui, sans-serif; background: #111; color: #eee; }
  header { position: sticky; top: 0; display: flex; gap: 6px; padding: 10px; background: #111; border-bottom: 1px solid #2a2a2a; }
  select { flex: 1; }
  button, select { font: inherit; background: #222; color: inherit; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; }
  #save { background: #2a6; border-color: #2a6; }
  #save:disabled { opacity: .4; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; }
  .item { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; outline: 2px solid transparent; }
  .item:has(input:checked) { outline-color: #2a6; }
  .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item input { position: absolute; top: 4px; left: 4px; }
  #msg { padding: 10px; color: #aaa; }
</style>
<header>
  <button id="all">Tout</button>
  <select id="cat"></select>
  <button id="save" disabled>Enregistrer</button>
</header>
<div id="msg"></div>
<div id="grid"></div>
<script type="module" src="popup.js"></script>
